; Mosaic — Moodle PHP tuning overrides.
;
; Rendered into ./.devenv/php.ini and bind-mounted into the VM at
; /etc/php/<ver>/fpm/conf.d/99-moodle.ini AND /etc/php/<ver>/cli/conf.d/99-moodle.ini.
; The "99-" prefix sorts after Ubuntu's stock conf.d files so our
; values win the last-wins merge. Edit on host; reload with
; `mosaic reload-web`.

; Moodle's recommended limits. Course imports and backups regularly
; hit ~100MB; uploads ~50MB; admin scripts can be slow under load.
max_input_vars       = 5000
post_max_size        = 200M
upload_max_filesize  = 200M
memory_limit         = 512M
max_execution_time   = 300

; Default to UTC. Per-project override available by editing this file
; (or, eventually, a wwwroot-aware default in mosaic.yaml).
date.timezone        = UTC

; OPcache — significant speed-up for any non-trivial Moodle page.
; revalidate_freq=0 means "always check mtime"; fine for dev (slower
; than =60 but ensures edits show up immediately). Production-tuned
; values would set this to 60+ and turn off opcache.validate_timestamps.
opcache.enable                = 1
opcache.enable_cli            = 0
opcache.memory_consumption    = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq       = 0
opcache.validate_timestamps   = 1

; Moodle's CLI scripts (cron, install.php, upgrade.php) can chew
; significant memory on large installs.
cli_server.color = On
