# Mosaic — nginx vhost for Moodle / Workplace / Totara.
#
# Rendered into ./.mosaic/nginx.conf and bind-mounted into the VM at
# /etc/nginx/sites-enabled/moodle.conf. Edit on the host; reload with
# `mosaic reload-web`.
#
# server_name is "_" (catch-all) — Mosaic gives each project its own
# Lima VM with its own port forward, so we don't need vhost-based
# routing. Whatever resolves to this port reaches this server block.
# That keeps the config independent of the user's wwwroot setting:
# `localhost`, `moodle.test`, anything else — all work.

server {
    listen @@WEB_PORT@@ default_server;
    listen [::]:@@WEB_PORT@@ default_server;

    server_name _;

    # WEBROOT differs per Moodle major version:
    #   4.x  → /srv/<framework>          (everything served from framework root)
    #   5.x+ → /srv/<framework>/public   (Moodle moved web-accessible files
    #                                     into a public/ subdirectory; config.php
    #                                     and CLI scripts remain at the root)
    # render-services.sh derives the right value from the profile's
    # plugins_root setting and substitutes it here.
    root @@WEBROOT@@;
    index index.php;

    # Moodle uploads (course backups, large files) regularly hit
    # 100MB+ — match the post_max_size we set in moodle-php.ini.
    client_max_body_size 200M;

    # Moodle's "slasharguments" feature — pretty URLs that pack
    # arguments into the path (e.g. /pluginfile.php/123/foo/bar.png).
    # The rewrite peels the trailing path off and puts it in ?file=.
    rewrite ^(/.*\.php)(/)(.*)$ $1?file=/$3 last;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php@@PHP_VERSION@@-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Moodle's pages can be heavy; bump buffers and timeout from
        # nginx defaults. Matches what Moodle's docs recommend.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Defence-in-depth: refuse any request for hidden files (no
    # .htaccess leaking, no stray .git if a plugin has one nested).
    location ~ /\. {
        deny all;
    }
}
