# Mosaic — nginx vhost for Laravel projects.
#
# Rendered into ./.devenv/nginx.conf and bind-mounted into the VM at
# /etc/nginx/sites-enabled/laravel.conf. Edit on the host; reload with
# `mosaic reload-web`.
#
# Laravel's standard recipe: serve from <project>/public; route every
# unknown path through index.php. No slasharguments rewrite (that's
# Moodle).

server {
    listen @@WEB_PORT@@ default_server;
    listen [::]:@@WEB_PORT@@ default_server;

    server_name _;

    root /srv/project/@@PROJECT_DESTINATION@@/public;
    index index.php;

    # Laravel doesn't need anything as large as Moodle, but tolerate
    # reasonable form posts and uploads.
    client_max_body_size 50M;

    # Pretty URL routing — try literal file, then directory, then
    # delegate to index.php with the original query string.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php@@PHP_VERSION@@-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Refuse hidden files.
    location ~ /\. {
        deny all;
    }
}
