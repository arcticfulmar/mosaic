# Mosaic — mariadb services compose for Moodle / Workplace / Totara
# (and Laravel projects that opt into mariadb).
#
# Rendered into ./.devenv/services-compose.yaml; podman compose runs
# this inside the VM. `mosaic up` starts these services; `mosaic down`
# stops them; the named volume preserves DB state across stop/start.
#
# Container names are project-prefixed (mosaic-<project>-db etc.) so
# they're predictable for `mosaic db` and friends.
#
# DB credentials are framework-controlled (see render-services.sh):
#   moodle/workplace/totara → moodle/m@odl3ing/moodle (matches install.php args)
#   laravel                → app/app/app           (Laravel app reads from its .env)

services:
  db:
    image: mariadb:@@DB_VERSION@@
    container_name: mosaic-@@PROJECT_NAME@@-db
    restart: unless-stopped
    environment:
      # The container is only reachable via 127.0.0.1 inside the VM
      # (and Lima-forwarded to 127.0.0.1 on the host), so the trivial
      # password is fine for dev. Production use is out of scope.
      MARIADB_ROOT_PASSWORD: @@DB_PASS@@
      MARIADB_USER: @@DB_USER@@
      MARIADB_PASSWORD: @@DB_PASS@@
      MARIADB_DATABASE: @@DB_NAME@@
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --innodb_file_per_table=On
    volumes:
      - mosaic-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:@@DB_PORT@@:3306"

  mailpit:
    image: axllent/mailpit:latest
    container_name: mosaic-@@PROJECT_NAME@@-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:@@MAILPIT_UI_PORT@@:8025"   # web UI
      - "127.0.0.1:@@MAILPIT_SMTP_PORT@@:1025" # SMTP

volumes:
  mosaic-db-data:
